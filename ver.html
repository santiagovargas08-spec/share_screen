<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <title>Receptor Chromecast</title>
    <script src="https://unpkg.com/peerjs@1.4.7/dist/peerjs.min.js"></script>
    <style>
        body { background: black; color: white; margin: 0; font-family: Arial; overflow: hidden; display: flex; justify-content: center; align-items: center; height: 100vh; flex-direction: column; text-align: center; }
        
        /* Hacemos que el video no pueda ser "tocado" por el sistema del Chromecast para evitar el botón gris */
        #video-pantalla { width: 100vw; height: 100vh; object-fit: contain; display: none; background: #000; pointer-events: none; }
        
        .botones { display: flex; gap: 15px; flex-direction: column; align-items: center; z-index: 10; }
        button { padding: 30px; font-size: 28px; color: white; border: none; border-radius: 10px; cursor: pointer; font-weight: bold; width: 350px; }
        
        #btn-iniciar { background: #007bff; border: 4px solid transparent; }
        /* Efecto visual para que ella sepa que el botón está seleccionado con el control remoto */
        #btn-iniciar:focus { border: 4px solid white; transform: scale(1.05); } 
        
        #mensaje { margin-top: 30px; font-size: 22px; color: #aaa; }
    </style>
</head>
<body>

    <div class="botones" id="contenedor-botones">
        <!-- Añadimos 'autofocus' para que el control remoto lo seleccione de inmediato -->
        <button id="btn-iniciar" autofocus>Esperando señal...</button>
        <p id="mensaje">Cargando sistema...</p>
    </div>

    <!-- Sin 'controls' para evitar que Android TV interfiera -->
    <video id="video-pantalla" playsinline autoplay></video>

    <script>
        const peer = new Peer('cine-receptor-hd', { config: { 'iceServers': [{ 'urls': 'stun:stun.l.google.com:19302' }] } });
        
        const video = document.getElementById('video-pantalla');
        const btnIniciar = document.getElementById('btn-iniciar');
        const msj = document.getElementById('mensaje');
        const contenedor = document.getElementById('contenedor-botones');

        let streamRecibido = null;

        peer.on('open', () => { 
            msj.innerText = "Chromecast conectado. Esperando al PC..."; 
        });

        peer.on('call', llamada => {
            llamada.answer(); 
            llamada.on('stream', stream => {
                streamRecibido = stream;
                btnIniciar.innerText = "▶ VER PELÍCULA";
                btnIniciar.style.background = "#e50914";
                msj.innerText = "¡Señal optimizada recibida! Presiona el botón.";
                btnIniciar.focus(); // Obligamos al control remoto a enfocarse aquí
            });
        });

        btnIniciar.onclick = () => {
            if (streamRecibido) {
                // Truco de arranque: asignamos el video, lo mostramos y forzamos el play de inmediato
                video.srcObject = streamRecibido;
                contenedor.style.display = 'none';
                video.style.display = 'block';
                
                // Un pequeño retraso (100ms) le da tiempo al Chromecast de procesar la etiqueta antes de darle play
                setTimeout(() => {
                    video.play().catch(e => {
                        contenedor.style.display = 'flex';
                        msj.innerText = "Error forzando video: " + e.message;
                    });
                }, 100);
            } else {
                msj.innerText = "Aún no ha llegado la señal del PC.";
            }
        };
    </script>
</body>
</html>
