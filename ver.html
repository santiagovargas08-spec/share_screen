<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <title>Receptor Cine HD</title>
    <script src="https://unpkg.com/peerjs@1.4.7/dist/peerjs.min.js"></script>
    <style>
        body { background: black; color: white; margin: 0; font-family: Arial; overflow: hidden; display: flex; justify-content: center; align-items: center; height: 100vh; flex-direction: column; text-align: center; }
        
        #video-pantalla { width: 100vw; height: 100vh; object-fit: contain; display: none; background: #000; }
        
        .botones { display: flex; gap: 15px; flex-direction: column; }
        button { padding: 25px; font-size: 24px; color: white; border: none; border-radius: 10px; cursor: pointer; font-weight: bold; width: 300px; box-shadow: 0 4px 6px rgba(0,0,0,0.3); }
        
        #btn-iniciar { background: #007bff; }
        #btn-fullscreen { background: #333; display: none; padding: 15px; font-size: 18px; position: absolute; bottom: 20px; right: 20px; width: auto; opacity: 0.5; }
        #btn-fullscreen:hover { opacity: 1; }
        
        #mensaje { margin-top: 30px; font-size: 20px; color: #aaa; }
    </style>
</head>
<body>

    <div class="botones" id="contenedor-botones">
        <button id="btn-iniciar">Esperando señal...</button>
        <p id="mensaje">Conectando al sistema...</p>
    </div>

    <video id="video-pantalla" playsinline></video>
    <button id="btn-fullscreen">⛶ Pantalla Completa</button>

    <script>
        const peer = new Peer('cine-receptor-hd', { config: { 'iceServers': [{ 'urls': 'stun:stun.l.google.com:19302' }] } });
        
        const video = document.getElementById('video-pantalla');
        const btnIniciar = document.getElementById('btn-iniciar');
        const btnFullscreen = document.getElementById('btn-fullscreen');
        const msj = document.getElementById('mensaje');
        const contenedor = document.getElementById('contenedor-botones');

        let streamRecibido = null;

        peer.on('open', () => { 
            msj.innerText = "PC listo. Esperando que inicie la película..."; 
        });

        peer.on('call', llamada => {
            llamada.answer(); 
            llamada.on('stream', stream => {
                streamRecibido = stream;
                btnIniciar.innerText = "▶ REPRODUCIR CINE";
                btnIniciar.style.background = "#e50914";
                msj.innerText = "¡Señal recibida en HD!";
            });
        });

        btnIniciar.onclick = () => {
            if (streamRecibido) {
                video.srcObject = streamRecibido;
                video.style.display = 'block';
                btnFullscreen.style.display = 'block';
                contenedor.style.display = 'none';
                
                video.play().catch(e => msj.innerText = "Error: " + e);
            } else {
                video.play().catch(e => {});
                msj.innerText = "Aún no ha llegado la señal del PC, espera...";
            }
        };

        // Función para poner en pantalla completa
        btnFullscreen.onclick = () => {
            if (video.requestFullscreen) {
                video.requestFullscreen();
            } else if (video.webkitRequestFullscreen) { /* Safari */
                video.webkitRequestFullscreen();
            } else if (video.msRequestFullscreen) { /* IE11 */
                video.msRequestFullscreen();
            }
            btnFullscreen.style.display = 'none'; // Se oculta al entrar en pantalla completa
        };
    </script>
</body>
</html>
