<!DOCTYPE html>
<html>
<head>
    <meta charset="utf-8">
    <title>Receptor TV Antiguo</title>
    <!-- Usamos una versión más antigua de PeerJS -->
    <script src="https://unpkg.com/peerjs@1.3.2/dist/peerjs.min.js"></script>
    <style>
        body { background: black; color: white; text-align: center; font-family: Arial; padding-top: 50px; }
        #video-tv { width: 90%; max-height: 80vh; background: #111; display: none; margin: 0 auto; }
        button { padding: 30px; font-size: 24px; background: #007bff; color: white; border: none; cursor: pointer; }
        #mensaje { font-size: 22px; color: #ffc107; margin-top: 20px; }
    </style>
</head>
<body>

    <button id="btn-iniciar">1. CONECTAR AL PC</button>
    <p id="mensaje">Iniciando sistema clásico...</p>

    <video id="video-tv" controls autoplay></video>

    <script>
        // JavaScript Clásico: Solo usamos 'var' y 'function()'
        var video = document.getElementById('video-tv');
        var btn = document.getElementById('btn-iniciar');
        var msj = document.getElementById('mensaje');
        var miStream = null;

        try {
            var peer = new Peer('cine-smart-tv', { 
                config: { 'iceServers': [{ 'urls': 'stun:stun.l.google.com:19302' }] } 
            });

            peer.on('open', function(id) { 
                msj.innerHTML = "TV listo. Envía la película desde tu PC."; 
            });

            peer.on('call', function(llamada) {
                llamada.answer(); 
                llamada.on('stream', function(stream) {
                    miStream = stream;
                    msj.innerHTML = "¡Señal recibida! Presiona el botón rojo.";
                    btn.innerHTML = "2. VER PELÍCULA";
                    btn.style.background = "#e50914";
                });
            });

            peer.on('error', function(err) {
                msj.innerHTML = "Error de conexión: " + err.type;
            });

            btn.onclick = function() {
                if (miStream) {
                    btn.style.display = 'none';
                    msj.style.display = 'none';
                    video.style.display = 'block';
                    
                    try {
                        // Truco para televisores antiguos
                        if ('srcObject' in video) {
                            video.srcObject = miStream;
                        } else {
                            video.src = window.URL.createObjectURL(miStream);
                        }
                        video.play();
                    } catch(e) {
                        msj.style.display = 'block';
                        msj.innerHTML = "Error de video: " + e.message;
                    }
                } else {
                    msj.innerHTML = "Aún no llega la señal. Revisa el PC.";
                }
            };
        } catch (error) {
            msj.innerHTML = "Fallo crítico de hardware: " + error.message;
        }
    </script>
</body>
</html>
