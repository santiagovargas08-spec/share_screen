<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <title>Receptor Smart TV</title>
    <script src="https://unpkg.com/peerjs@1.4.7/dist/peerjs.min.js"></script>
    <style>
        body { background: black; color: white; margin: 0; font-family: Arial; display: flex; justify-content: center; align-items: center; height: 100vh; flex-direction: column; text-align: center; }
        
        /* Video forzado a ocupar espacio pero con controles */
        #video-tv { width: 90vw; height: 80vh; background: #111; display: none; }
        
        #btn-iniciar { padding: 30px; font-size: 28px; background: #007bff; color: white; border: none; border-radius: 15px; cursor: pointer; }
        
        #mensaje { margin-top: 20px; font-size: 18px; color: #ffc107; }
    </style>
</head>
<body>

    <button id="btn-iniciar">1. CONECTAR CON EL PC</button>
    <p id="mensaje">Esperando conexión...</p>

    <!-- Añadimos 'controls' para que si el autoplay falla, tú puedas darle play manual -->
    <video id="video-tv" playsinline autoplay muted controls></video>

    <script>
        const peer = new Peer('cine-smart-tv', { config: { 'iceServers': [{ 'urls': 'stun:stun.l.google.com:19302' }] } });
        
        const video = document.getElementById('video-tv');
        const btn = document.getElementById('btn-iniciar');
        const msj = document.getElementById('mensaje');

        peer.on('open', () => { msj.innerText = "Esperando señal del PC..."; });

        peer.on('call', llamada => {
            llamada.answer(); 
            llamada.on('stream', stream => {
                msj.innerText = "¡Señal recibida! Dale al botón de abajo.";
                btn.innerText = "2. MOSTRAR PELÍCULA";
                btn.style.background = "#e50914";
                
                // Guardamos el stream para usarlo luego
                window.miStream = stream;
            });
        });

        // Depuración de errores: si el video falla, el TV nos dirá por qué
        video.onerror = (e) => { msj.innerText = "Error de Video: " + e.target.error.message; };

        btn.onclick = () => {
            if (window.miStream) {
                video.style.display = 'block';
                video.srcObject = window.miStream;
                btn.style.display = 'none';
                msj.style.display = 'none';
                
                // Intento forzado de reproducción
                video.play().catch(err => {
                    msj.style.display = 'block';
                    msj.innerText = "El TV bloqueó el autoplay. Usa el control remoto para presionar PLAY en el reproductor de abajo.";
                });
            } else {
                msj.innerText = "Aún no ha llegado la película. Verifica el PC.";
            }
        };
    </script>
</body>
</html>
