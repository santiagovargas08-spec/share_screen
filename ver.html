<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <title>Receptor Smart TV</title>
    <script src="https://unpkg.com/peerjs@1.4.7/dist/peerjs.min.js"></script>
    <style>
        body { background: black; color: white; margin: 0; font-family: Arial; overflow: hidden; display: flex; justify-content: center; align-items: center; height: 100vh; flex-direction: column; text-align: center; }
        
        #video-tv { width: 100vw; height: 100vh; object-fit: contain; display: none; background: #000; }
        
        #btn-iniciar { padding: 40px; font-size: 32px; background: #007bff; color: white; border: none; border-radius: 15px; cursor: pointer; font-weight: bold; transition: 0.3s; }
        #btn-iniciar:focus, #btn-iniciar:hover { outline: 6px solid white; background: #0056b3; }
        
        #mensaje { margin-top: 30px; font-size: 24px; color: #aaa; }
    </style>
</head>
<body>

    <button id="btn-iniciar" autofocus>Esperando señal...</button>
    <p id="mensaje">Ingresando al sistema...</p>

    <video id="video-tv" playsinline></video>

    <script>
        const peer = new Peer('cine-smart-tv', { config: { 'iceServers': [{ 'urls': 'stun:stun.l.google.com:19302' }] } });
        
        const video = document.getElementById('video-tv');
        const btn = document.getElementById('btn-iniciar');
        const msj = document.getElementById('mensaje');

        let streamRecibido = null;

        peer.on('open', () => { 
            msj.innerText = "Televisor conectado. Esperando a que el PC envíe la película..."; 
        });

        peer.on('call', llamada => {
            // Se contesta la llamada, pero sin enviar NADA de regreso
            llamada.answer(); 
            
            llamada.on('stream', stream => {
                streamRecibido = stream;
                
                btn.innerText = "▶ VER PELÍCULA AHORA";
                btn.style.background = "#e50914";
                msj.innerText = "¡Película recibida!";
            });
        });

        btn.onclick = () => {
            if (streamRecibido) {
                video.srcObject = streamRecibido;
                video.style.display = 'block';
                btn.style.display = 'none';
                msj.style.display = 'none';
                
                video.play().catch(e => msj.innerText = "Error: " + e);
            } else {
                video.play().catch(e => {});
                msj.innerText = "Aún no ha llegado la señal del PC, espera...";
            }
        };
    </script>
</body>
</html>
