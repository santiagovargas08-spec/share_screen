<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <title>Receptor Ultra Ligero</title>
    <script src="https://unpkg.com/peerjs@1.4.7/dist/peerjs.min.js"></script>
    <style>
        body { background: black; color: white; margin: 0; font-family: Arial; overflow: hidden; display: flex; justify-content: center; align-items: center; height: 100vh; flex-direction: column; text-align: center; }
        
        #video-pantalla { width: 100vw; height: 100vh; object-fit: contain; display: none; background: #000; }
        
        /* CÓDIGO NUCLEAR: Oculta a la fuerza cualquier botón gris o control nativo que el Chromecast intente poner */
        video::-webkit-media-controls { display: none !important; }
        video::-webkit-media-controls-enclosure { display: none !important; }
        
        .botones { display: flex; gap: 15px; flex-direction: column; align-items: center; z-index: 10; }
        button { padding: 30px; font-size: 26px; color: white; border: none; border-radius: 10px; cursor: pointer; font-weight: bold; width: 350px; }
        
        #btn-iniciar { background: #007bff; border: 4px solid transparent; }
        #btn-iniciar:focus { border: 4px solid white; transform: scale(1.05); } 
        
        #mensaje { margin-top: 30px; font-size: 20px; color: #aaa; }
    </style>
</head>
<body>

    <div class="botones" id="contenedor-botones">
        <button id="btn-iniciar" autofocus>Esperando conexión...</button>
        <p id="mensaje">Conectando al PC...</p>
    </div>

    <!-- Se añade muted para que el navegador permita cargarlo en segundo plano -->
    <video id="video-pantalla" playsinline muted></video>

    <script>
        const peer = new Peer('cine-receptor-hd', { config: { 'iceServers': [{ 'urls': 'stun:stun.l.google.com:19302' }] } });
        
        const video = document.getElementById('video-pantalla');
        const btnIniciar = document.getElementById('btn-iniciar');
        const msj = document.getElementById('mensaje');
        const contenedor = document.getElementById('contenedor-botones');

        let listoParaVer = false;

        peer.on('open', () => { 
            msj.innerText = "Sistema listo. Esperando película..."; 
        });

        peer.on('call', llamada => {
            llamada.answer(); 
            llamada.on('stream', stream => {
                listoParaVer = true;
                
                // TRUCO DE RENDIMIENTO: Asignamos el video oculto y en silencio para que el Chromecast lo procese con calma
                video.srcObject = stream;
                video.play().catch(e => console.log("Carga silenciosa pendiente..."));

                btnIniciar.innerText = "▶ ENTRAR A LA SALA";
                btnIniciar.style.background = "#e50914";
                msj.innerText = "¡Video cargado! Presiona para ver y escuchar.";
                btnIniciar.focus(); 
            });
        });

        btnIniciar.onclick = () => {
            if (listoParaVer) {
                // Solo descubrimos la pantalla y encendemos el audio
                contenedor.style.display = 'none';
                video.style.display = 'block';
                video.muted = false; // Encendemos el sonido
                
                // Forzamos el play final por si acaso
                video.play().catch(e => {
                    contenedor.style.display = 'flex';
                    msj.innerText = "Aún procesando, intenta presionar de nuevo.";
                });
            } else {
                msj.innerText = "Aún no ha llegado la señal del PC.";
            }
        };
    </script>
</body>
</html>
