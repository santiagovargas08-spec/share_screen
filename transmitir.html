<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <title>Transmisor PC - Cine</title>
    <script src="https://unpkg.com/peerjs@1.4.7/dist/peerjs.min.js"></script>
    <style>
        body { background-color: #1a1a1a; color: white; font-family: Arial; padding: 50px; text-align: center; }
        h2 { font-size: 32px; margin-bottom: 30px; }
        button { padding: 20px; font-size: 22px; background: #e50914; color: white; border: none; border-radius: 8px; cursor: pointer; font-weight: bold; width: 100%; max-width: 400px; box-shadow: 0 4px 10px rgba(229, 9, 20, 0.5); }
        button:hover { background: #ff0f1a; transform: scale(1.02); transition: 0.2s; }
        #estado { margin-top: 30px; font-size: 18px; color: #888; }
    </style>
</head>
<body>
    <h2>Transmisor al Chromecast</h2>
    
    <button id="btn-transmitir">Compartir Película</button>
    <p id="estado">Estado: Iniciando servidor...</p>

    <script>
        const ID_RECEPTOR = 'cine-receptor-hd'; 
        const peer = new Peer('cine-pc-transmisor', { config: { 'iceServers': [{ 'urls': 'stun:stun.l.google.com:19302' }] } });
        
        const estado = document.getElementById('estado');

        peer.on('open', () => {
            estado.innerText = "Estado: Sistema listo. Presiona el botón rojo.";
            estado.style.color = "#28a745";
        });

        document.getElementById('btn-transmitir').onclick = async () => {
            try {
                // Resolución automática, pero audio optimizado para películas
                const stream = await navigator.mediaDevices.getDisplayMedia({ 
                    video: true, 
                    audio: {
                        echoCancellation: false,
                        noiseSuppression: false,
                        autoGainControl: false
                    }
                });
                
                peer.call(ID_RECEPTOR, stream);
                estado.innerText = "Estado: ¡Transmitiendo película!";
                estado.style.color = "#007bff";
            } catch (e) {
                estado.innerText = "Transmisión cancelada: " + e.message;
                estado.style.color = "red";
            }
        };
    </script>
</body>
</html>
